   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start" x="31.68" y="26.7375" transform="rotate(-0 31.68 26.7375)">Pulsatilla alpina: the offspring endpoint changes the gain curve</text>
  </g>
  <g id="text_26">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586472" x="31.68" y="43.74" transform="rotate(-0 31.68 43.74)">Secondary analysis of public individual data | one population, 2022</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #586472" transform="translate(31.68 519.665062)">Bars: 95% percentile intervals from 10,000 paired plant resamples. Allocation uses organ counts, not individual floral mass.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #586472" transform="translate(31.68 532.478531)">Intervals condition on the deposited paternity estimates and fixed inbreeding depression (delta = 0.95). No survival was measured here.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #586472" transform="translate(31.68 545.292)">Panel B is an overlapping subset of panel A, not an independent population. Positive pistil counts: 70 in A; 44 in B.</text>
  </g>
 </g>
