name: Oenothera paternal multilocus identity scrambling negcontrol v60
on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/oenothera_v60_paternal_locus_scramble.py
      - .github/workflows/oenothera-v60-paternal-scramble.yml
permissions: {contents: read}
jobs:
  source-backed-paternal-locus-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-audit numeric dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3
      - name: Recompute original seven-locus genetics, coherent relabeling identity, global and subgroup paternal marker scrambles
        run: python scripts/oenothera_v60_paternal_locus_scramble.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oenothera-v60-aggregate-only
          path: analysis_results_oenothera_paternal_multilocus_v60/
          retention-days: 30
