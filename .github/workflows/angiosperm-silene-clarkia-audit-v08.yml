name: Verify raw Silene visual-only and Clarkia pollen treatment design

on:
  workflow_dispatch:
  push:
    branches:
      - research/angiosperm-reproductive-decoupling-20261115
    paths:
      - scripts/silene_clarkia_design_audit_v08.py
      - .github/workflows/angiosperm-silene-clarkia-audit-v08.yml

permissions:
  contents: read

jobs:
  two-experiment-source-grain:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install source data validators
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas
      - name: Inspect official original public source ZIP files, denominators and protocol
        run: .venv/bin/python scripts/silene_clarkia_design_audit_v08.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silene-clarkia-original-treatment-design-audit-v08
          path: analysis_results_silene_clarkia_design_v08/
          retention-days: 30
          if-no-files-found: warn
