name: "Daphne genetically confirmed HF sire distance and 5m robustness v0.29"
on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/daphne_jezoensis_2018_2020_HF_paternity_distance_v29.py
      - scripts/daphne_jezoensis_2018_2020_local_mate_fruit_v27.py
      - scripts/daphne_jezoensis_2018_2020_HF_fathers_v28.py
      - .github/workflows/daphne-HF-paternity-distance-v29.yml
permissions:
  contents: read
jobs:
  verified-HF-sire-distance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Original public-source dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas scipy
      - name: Verify HF father distances and neighborhood sensitivity
        run: .venv/bin/python scripts/daphne_jezoensis_2018_2020_HF_paternity_distance_v29.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-confirmed-HF-sire-local-distance-v29
          path: analysis_results_daphne_HF_true_nearby_v29/
          retention-days: 30
          if-no-files-found: warn
