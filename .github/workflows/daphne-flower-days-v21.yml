name: "Daphne 2018 source female versus male-biased flower-days v0.21"
on:
  workflow_dispatch:
  push:
    branches:
      - research/angiosperm-reproductive-decoupling-20261115
    paths:
      - scripts/daphne_jezoensis_2018_flower_days_v21.py
      - .github/workflows/daphne-flower-days-v21.yml
permissions:
  contents: read
jobs:
  original-flower-opportunity:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Prepare original-source environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas
      - name: Verify original published source and estimate bounded flower-days
        run: .venv/bin/python scripts/daphne_jezoensis_2018_flower_days_v21.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-daphne-flower-day-opportunity-sex-treatment-v21
          path: analysis_results_daphne_flower_days_v21/
          retention-days: 30
          if-no-files-found: warn
