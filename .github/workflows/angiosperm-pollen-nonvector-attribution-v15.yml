name: "Pollen stage attribution under non-vector losses (v0.15)"
on:
  workflow_dispatch:
  push:
    branches:
      - research/angiosperm-reproductive-decoupling-20261115
    paths:
      - scripts/johnson_harder2023_nonvector_attribution_sensitivity_v15.py
      - .github/workflows/angiosperm-pollen-nonvector-attribution-v15.yml
permissions:
  contents: read
jobs:
  source-pinned-nonvector-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install limited original source dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas openpyxl
      - name: Verify original 228-species source and stress-test non-vector losses
        run: .venv/bin/python scripts/johnson_harder2023_nonvector_attribution_sensitivity_v15.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pollen-nonvector-stage-attribution-198-original-species-v15
          path: analysis_results_pollen_nonvector_sensitivity_v15/
          retention-days: 30
          if-no-files-found: warn
