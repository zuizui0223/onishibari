name: "228 species pollen fates: verify Figshare and Dryad original source grain"
on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/johnson_harder2023_global_pollen_source_audit_v14.py
      - .github/workflows/angiosperm-global-pollen-economy-v14.yml
permissions:
  contents: read
jobs:
  original-global-pollen-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install source table parsers
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q pandas openpyxl xlrd
      - name: Audit open species-level pollen production removal transfer data
        run: .venv/bin/python scripts/johnson_harder2023_global_pollen_source_audit_v14.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: johnson-harder-2023-species-level-pollen-source-v14
          path: analysis_results_global_pollen_economy_original_v14/
          retention-days: 30
          if-no-files-found: warn
