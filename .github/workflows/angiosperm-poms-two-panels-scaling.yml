name: UK PoMS two survey stream floral-unit scaling comparison

on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/ukpoms_public_vs_allocated_flower_scaling.py
      - .github/workflows/angiosperm-poms-two-panels-scaling.yml

permissions:
  contents: read

jobs:
  two-poms-survey-streams:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Poisson NB categorical regression packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas scipy scikit-learn statsmodels patsy
      - name: Compare volunteer and allocated survey stream visitor-flower scaling with 1km clusters
        run: |
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 .venv/bin/python scripts/ukpoms_public_vs_allocated_flower_scaling.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ukpoms-both-survey-streams-floral-scaling
          path: analysis_results_flower_scaling_two_panels/
          if-no-files-found: warn
