name: "Original Clarkia concinna five-study source, flower display and geitonogamy audit"

on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/clarkia_concinna_five_studies_audit_v13.py
      - .github/workflows/angiosperm-clarkia-concinna-source-v13.yml

permissions:
  contents: read

jobs:
  original-five-studies-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Install original source schema parser
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q pandas numpy
      - name: Audit all five primary Clarkia manipulations and variable names
        run: .venv/bin/python scripts/clarkia_concinna_five_studies_audit_v13.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clarkia-concinna-5-study-original-source-schema-v13
          path: analysis_results_clarkia_concinna_design_v13/
          retention-days: 30
          if-no-files-found: warn
