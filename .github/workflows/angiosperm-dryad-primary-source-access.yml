name: Primary floral reproduction Dryad public API accessibility audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/angiosperm-reproductive-decoupling-20261115
    paths:
      - scripts/probe_official_dryad_reproductive_files.py
      - .github/workflows/angiosperm-dryad-primary-source-access.yml

permissions:
  contents: read

jobs:
  anonymous-public-file-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Query official documented Dryad read-only public endpoints
        run: python3 scripts/probe_official_dryad_reproductive_files.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dryad-official-public-file-probe-reproductive-investment
          path: analysis_results_dryad_access_20261115/
          retention-days: 30
          if-no-files-found: warn
