name: Daphne original paternity confidence and adversarial label audit v56
on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/daphne_v56_confidence_adversarial.py
      - .github/workflows/daphne-v56-confidence-sensitivity.yml
permissions: {contents: read}
jobs:
  source-stratified-paternity-confidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical stack
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3
      - name: Audit natural-only paternity posterior thresholds, spatial nulls and relabeling bound
        run: python scripts/daphne_v56_confidence_adversarial.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-v56-confidence-aggregate-only
          path: analysis_results_daphne_confidence_prior_v56/
          retention-days: 30
