name: "Daphne source-verified sex-system taxon concept provenance guard v0.40"
on:
  workflow_dispatch:
  push:
    branches:
      - research/onishibari-sex-system-20261114
    paths:
      - data/derived/daphne_sex_taxon_concept_provenance_v40.csv
      - analysis/validate_daphne_sex_taxon_concepts_v40.py
      - .github/workflows/daphne-sex-provenance-v40.yml
permissions:
  contents: read
jobs:
  published-source-sex-system-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate focal taxon sex-system conflict and historical synonym gates
        run: python3 analysis/validate_daphne_sex_taxon_concepts_v40.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-focal-vs-congeneric-sex-concept-provenance-v40
          path: analysis_results_daphne_sex_taxon_v40/
          retention-days: 30
          if-no-files-found: warn
