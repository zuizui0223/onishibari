name: Added value NDVI over impervious and local flowers Zurich 2016

on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/zurich2016_ndvi_added_value.py
      - .github/workflows/angiosperm-zurich-ndvi-added.yml

permissions:
  contents: read

jobs:
  compare-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install source imagery, math and heldout prediction packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q pystac-client planetary-computer rasterio scipy numpy scikit-learn
      - name: Compare same-year NDVI against 2026 publication variables under 24-garden LOOCV
        run: .venv/bin/python scripts/zurich2016_ndvi_added_value.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angiosperm-2016-NDVI-vs-urban-cover-flower-richness
          path: analysis_results_zurich_ndvi_incremental/
          if-no-files-found: warn
