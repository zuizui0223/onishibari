name: "51-species pollen and ovules against pollen transfer efficiency: cross-source overlap"
on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/johnson_harder2023_pollen_ovules_51_overlap_v14.py
      - scripts/johnson_harder2023_pollen_fates_v14.py
      - .github/workflows/angiosperm-pollen-ovules-overlap-v14.yml
permissions:
  contents: read
jobs:
  pollen-ovule-source-overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install original-source quantitative tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas scipy statsmodels openpyxl
      - name: Reanalyse original 51-species pollen ovule PTE gradient and duplicate taxa
        run: .venv/bin/python scripts/johnson_harder2023_pollen_ovules_51_overlap_v14.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pollen-ovules-51-species-and-228-overlap-v14
          path: analysis_results_global_pollen_po_link_v14/
          retention-days: 30
          if-no-files-found: warn
