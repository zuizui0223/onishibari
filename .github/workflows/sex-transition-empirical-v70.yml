name: Empirical sex-transition source and matched-stage analysis v70
on:
  push:
    branches: [research/sex-function-transition-v68-20261127]
    paths:
      - scripts/sex_transition_empirical_v70.py
      - .github/workflows/sex-transition-empirical-v70.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  empirical:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==2.2.3 openpyxl==3.1.5 xlrd==2.0.1 scipy==1.15.3
      - run: python scripts/sex_transition_empirical_v70.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sex-transition-v70-source-and-aggregate-results
          path: analysis_results_sex_transition_v70/
