name: Silene 2026 public Dataverse pollen deposition and paternity source audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/angiosperm-reproductive-decoupling-20261115
    paths:
      - scripts/joffard2026_dataverse_source_inventory_v09.py
      - .github/workflows/angiosperm-joffard2026-original-v09.yml

permissions:
  contents: read

jobs:
  original-archive-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Read public experimental data via documented Dataverse API
        run: python3 scripts/joffard2026_dataverse_source_inventory_v09.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joffard-2026-pollen-deposition-paternity-source-audit
          path: analysis_results_joffard2026_public_source_v09/
          retention-days: 30
          if-no-files-found: warn
