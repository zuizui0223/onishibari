name: Daphne within-mother father clustering fixed-margin v54
on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/daphne_jezoensis_parentage_clustering_v54.py
      - scripts/verify_daphne_mother_sire_v54.py
      - data/2026-11-24_daphne_mother_sire_clustering_v54.json
      - results/2026-11-24_daphne_mother_sire_concentration_v54.md
      - .github/workflows/daphne-parentage-clustering-v54.yml
permissions: {contents: read}
jobs:
  original-source-fixed-margins-null:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical environment
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3
      - name: Original SSR fathers, 3 conditional nulls, source SHA check
        run: python scripts/daphne_jezoensis_parentage_clustering_v54.py
      - name: Recompute & verify entire original-source numerical aggregate
        run: python scripts/verify_daphne_mother_sire_v54.py --actual analysis_results_daphne_mother_sire_clustering_v54/daphne_parentage_sire_clustering_v54.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-parentage-clustering-v54-aggregates
          path: analysis_results_daphne_mother_sire_clustering_v54/
          retention-days: 30
