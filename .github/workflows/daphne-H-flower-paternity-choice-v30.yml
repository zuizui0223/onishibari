name: "Daphne H floral display to genetically assigned paternal offspring conditional choice v0.30"
on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/daphne_jezoensis_2018_2020_flower_to_paternity_choice_v30.py
      - scripts/daphne_jezoensis_2018_2020_HF_fathers_v28.py
      - .github/workflows/daphne-H-flower-paternity-choice-v30.yml
permissions:
  contents: read
jobs:
  female-choice-conditioned-male-flowers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install source-analysis Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas scipy
      - name: Verify author original files and fit father choice versus H floral display
        run: .venv/bin/python scripts/daphne_jezoensis_2018_2020_flower_to_paternity_choice_v30.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-H-flowers-SSR-paternity-conditional-mother-v30
          path: analysis_results_daphne_flower_to_paternity_v30/
          retention-days: 30
          if-no-files-found: warn
