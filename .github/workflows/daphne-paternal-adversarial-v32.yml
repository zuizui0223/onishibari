name: "Daphne fatherhood size effect: spatial and high-display stress tests v0.32"
on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/daphne_jezoensis_2018_2020_paternal_adversarial_v32.py
      - scripts/daphne_jezoensis_2018_2020_flower_to_paternity_choice_v30.py
      - .github/workflows/daphne-paternal-adversarial-v32.yml
permissions:
  contents: read
jobs:
  source-paternity-robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Source-reanalysis environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas scipy
      - name: Stress-test maternal block holdout and high-display sire influence
        run: .venv/bin/python scripts/daphne_jezoensis_2018_2020_paternal_adversarial_v32.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-sire-display-spatial-block-exact-F-robustness-v32
          path: analysis_results_daphne_fatherhood_robust_v32/
          retention-days: 30
          if-no-files-found: warn
