name: iNaturalist all-photo morphology audit
on:
  push:
    branches: [research/onishibari-sex-system-20261114]
    paths:
      - 'analysis/inat_all_photo_audit.py'
      - 'analysis/inat_all_photo_gallery.py'
      - 'analysis/validate_all_photo_review.py'
      - 'analysis/audit_hamaya_photo_phenology.py'
      - 'data/derived/primary_onishibari_morph_phenology_evidence.csv'
      - 'data/derived/inat_visual_screen_v02.csv'
      - '.github/workflows/inat_all_photo.yml'
  pull_request:
    paths:
      - 'analysis/inat_all_photo_audit.py'
      - 'analysis/inat_all_photo_gallery.py'
      - '.github/workflows/inat_all_photo.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  query-and-illustrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve all observation photo metadata
        run: python3 -u analysis/inat_all_photo_audit.py
      - name: Install contact sheet image library
        run: python3 -m pip install --quiet pillow
      - name: Build attribution-aware manual screens of every licensed image
        run: python3 -u analysis/inat_all_photo_gallery.py
      - name: Validate 61 observation-level manual scores against live source IDs
        run: python3 analysis/validate_all_photo_review.py --output data/derived/all_photo_summary_generated.md
      - name: Cross-check historical morphology with verified photo dates
        run: python3 analysis/audit_hamaya_photo_phenology.py --output docs/hamaya_vs_photo_validation.md
      - name: Upload source-identified photo sheets and all-photo metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: inat-onishibari-all-photo-screens
          path: |
            data/derived/inat_all_photo_snapshot.json
            docs/hamaya_vs_photo_validation.md
            data/derived/all_photo_summary_generated.md
            data/derived/inat_visual_screen_v02.csv
            data/all_photo_gallery/*
          retention-days: 60
