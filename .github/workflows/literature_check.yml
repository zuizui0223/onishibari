name: Literature-data checks
on:
  push:
    branches:
      - research/onishibari-sex-system-20261114
  pull_request:
    paths:
      - 'data/derived/**'
      - 'analysis/**'
      - 'data/derived/inat_visual_screen_v01.csv'
      - 'docs/visual_photo_screen.md'
      - 'docs/comparative_results.md'
      - '.github/workflows/literature_check.yml'

jobs:
  verify-published-aggregates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check independent destructive sample stages and impossible assay counts
        run: python3 analysis/audit_2027_destructive_assays.py --self-test
      - name: Check that executed pollinations, donor QC and complete follow-up do not silently become successes
        run: python3 analysis/audit_2027_pilot_outcomes.py --self-test
      - name: Validate within-genet treatment randomizer with synthetic fixtures
        run: python3 analysis/randomize_2027_pilot.py --self-test
      - name: Validate zero-fruit interpretation with correlated flowers
        run: python3 analysis/zero_fruit_sensitivity.py --check
      - name: Generate unobserved zero-fruit sensitivity summary
        run: python3 analysis/zero_fruit_sensitivity.py
      - name: Validate original 1955 and 2020 source scope
        run: python3 analysis/audit_hamaya_photo_phenology.py --check
      - name: Check thesis seed-stage survival and inbreeding depression
        run: python3 analysis/reproduce_shibata2020_seed_survival.py --check
      - name: Validate separate mate scarcity and pollinator-service model
        run: python3 analysis/two_channel_pollen_mate_sensitivity.py --check
      - name: Generate two-channel model and related-species viability sensitivity
        run: python3 analysis/two_channel_pollen_mate_sensitivity.py
      - name: Validate retained pistil thought-experiment assumptions and thresholds
        run: python3 analysis/retained_female_function_scenarios.py --check
      - name: Generate conditional female-function retention report
        run: python3 analysis/retained_female_function_scenarios.py
      - name: Verify generated conditional theory against committed output
        run: git diff --exit-code -- docs/2026-11-14_retained_pistil_thresholds.md
      - name: Check genetic paternity assignment counts
        run: python3 analysis/reproduce_shibata2020_paternity.py
      - name: Check paternity-success fitted elasticities
        run: python3 analysis/reproduce_shibata2020_siring_elasticities.py
      - name: Check published aggregates
        run: python3 analysis/compare_published.py --check
      - name: Check synthetic field-design sensitivity simulator
        run: python3 analysis/synthetic_design_sensitivity.py --check --simulations 100
      - name: Validate manual visual screening
        run: python3 analysis/summarize_visual_screen.py --output docs/visual_photo_screen.md
      - name: Check visual screen summary freshness
        run: git diff --exit-code -- docs/visual_photo_screen.md
      - name: Regenerate report
        run: python3 analysis/compare_published.py --output docs/comparative_results.md
      - name: Fail if results are stale
        run: git diff --exit-code -- docs/comparative_results.md
      - name: Store theoretical zero-fruit sensitivity
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: onishibari-zero-fruit-design-sensitivity
          path: docs/zero_fruit_interpretation.md
          retention-days: 90
      - name: Save two-channel alternative theory report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daphne-pollinator-mate-two-channel-theory
          path: docs/2026-11-14_two_channel_retention_sensitivity.md
          retention-days: 90
      - name: Save hypothetical sex-function theory report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daphne-conditional-pistil-retention-theory
          path: docs/2026-11-14_retained_pistil_thresholds.md
          retention-days: 90
