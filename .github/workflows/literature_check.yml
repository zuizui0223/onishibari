name: Literature-data checks
on:
  push:
    branches:
      - research/onishibari-sex-system-20261114
  pull_request:
    paths:
      - 'data/derived/**'
      - 'analysis/**'
      - 'data/derived/inat_visual_screen_v01.csv'
      - 'docs/visual_photo_screen.md'
      - 'docs/comparative_results.md'
      - '.github/workflows/literature_check.yml'

jobs:
  verify-published-aggregates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate original 1955 and 2020 source scope
        run: python3 analysis/audit_hamaya_photo_phenology.py --check
      - name: Check thesis seed-stage survival and inbreeding depression
        run: python3 analysis/reproduce_shibata2020_seed_survival.py --check
      - name: Check genetic paternity assignment counts
        run: python3 analysis/reproduce_shibata2020_paternity.py
      - name: Check published aggregates
        run: python3 analysis/compare_published.py --check
      - name: Check synthetic field-design sensitivity simulator
        run: python3 analysis/synthetic_design_sensitivity.py --check --simulations 100
      - name: Validate manual visual screening
        run: python3 analysis/summarize_visual_screen.py --output docs/visual_photo_screen.md
      - name: Check visual screen summary freshness
        run: git diff --exit-code -- docs/visual_photo_screen.md
      - name: Regenerate report
        run: python3 analysis/compare_published.py --output docs/comparative_results.md
      - name: Fail if results are stale
        run: git diff --exit-code -- docs/comparative_results.md
