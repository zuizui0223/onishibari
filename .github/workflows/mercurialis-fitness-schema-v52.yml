name: Mercurialis public-source fitness schema audit v0.52
on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/mercurialis_v52_source_schema_audit.py
      - .github/workflows/mercurialis-fitness-schema-v52.yml
permissions:
  contents: read
jobs:
  inspect-public-source-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit pinned archive columns without printing genotypes or source rows
        run: python3 scripts/mercurialis_v52_source_schema_audit.py
