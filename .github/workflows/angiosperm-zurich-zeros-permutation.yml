name: Zurich 2016 same-garden permutation of zero-visit days and flower count

on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/zurich2016_zero_display_permutation.py
      - .github/workflows/angiosperm-zurich-zeros-permutation.yml

permissions:
  contents: read

jobs:
  same-garden-label-randomization:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Install NumPy
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy
      - name: Test greater visit occurrence on high-flower days conditional on same garden
        run: .venv/bin/python scripts/zurich2016_zero_display_permutation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zurich2016-same-garden-zero-day-flower-randomization
          path: analysis_results_within_garden_any_visit/
          if-no-files-found: warn
