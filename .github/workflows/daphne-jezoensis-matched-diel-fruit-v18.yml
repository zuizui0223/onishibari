name: "Daphne jezoensis matched daytime-nighttime maternal fruit original refit (v0.18)"
on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/daphne_jezoensis_2023_matched_diel_fruit_v18.py
      - .github/workflows/daphne-jezoensis-matched-diel-fruit-v18.yml
permissions:
  contents: read
jobs:
  original-maternal-fruit-pairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install original data analysis environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas scipy
      - name: Source-hash gate and matched 2018 and 2020 fruit rate refit
        run: .venv/bin/python scripts/daphne_jezoensis_2023_matched_diel_fruit_v18.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-jezoensis-2018-2020-female-matched-diel-fruit-v18
          path: analysis_results_daphne_jezoensis_paired_diel_v18/
          retention-days: 30
          if-no-files-found: warn
