name: "Daphne 2018–2020 natural fruit × local mate source identity audit v0.26"
on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/daphne_jezoensis_2018_2020_spatial_join_audit_v26.py
      - .github/workflows/daphne-spatial-join-audit-v26.yml
permissions:
  contents: read
jobs:
  source-maternal-genet-mapping:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Original source dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas
      - name: Audit exact ID matches and source flower/fruit/sex concordance
        run: .venv/bin/python scripts/daphne_jezoensis_2018_2020_spatial_join_audit_v26.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-2018-2020-maternal-location-join-eligibility-v26
          path: analysis_results_daphne_2018_2020_local_mates_v26/
          retention-days: 30
          if-no-files-found: warn
