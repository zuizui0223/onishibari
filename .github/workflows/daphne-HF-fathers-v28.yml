name: "Daphne 2018/2020 HF-coded parent true paternal success audit v0.28"
on:
  workflow_dispatch:
  push:
    branches:
      - research/angiosperm-reproductive-decoupling-20261115
    paths:
      - scripts/daphne_jezoensis_2018_2020_HF_fathers_v28.py
      - .github/workflows/daphne-HF-fathers-v28.yml
permissions:
  contents: read
jobs:
  original-SSR-father-sex:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Build original-public-data environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas
      - name: Source-verify 470 SSR father assignments against sex codes
        run: .venv/bin/python scripts/daphne_jezoensis_2018_2020_HF_fathers_v28.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-HF-genetic-fathers-2018-2020-v28
          path: analysis_results_daphne_HF_father_source_v28/
          retention-days: 30
          if-no-files-found: warn
