name: Independent Oenothera distance-free genetics paternity feasibility v57
on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/oenothera_v57_genotype_only_paternity.py
      - .github/workflows/oenothera-v57-genotype-only.yml
permissions: {contents: read}
jobs:
  verified-independent-Mendelian-alleles:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned reproducible Python stack
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3
      - name: Original 7 SSR distance-free candidate compatibility and family cofather correlation
        run: python scripts/oenothera_v57_genotype_only_paternity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oenothera-genotype-only-v57-aggregate
          path: analysis_results_independent_oenothera_v57/
          retention-days: 30
