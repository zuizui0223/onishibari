name: Daphne genus ITS sampling sensitivity

on:
  workflow_dispatch:
  push:
    branches: [research/daphne-comparative-2026-11-15]
    paths:
      - scripts/daphne_multitaxon_its.py
      - .github/workflows/daphne-multitaxon-its.yml

permissions:
  contents: read

jobs:
  stress-test-genus-sampling:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install MAFFT IQ-TREE and Biopython
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mafft iqtree
          python3 -m pip install --break-system-packages biopython || pip install biopython
      - name: Validate Daphne accession series and infer broad taxon-sampled nrITS trees
        run: python3 scripts/daphne_multitaxon_its.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-genus-its-sampling-stress-test
          path: analysis_results_multitaxon_its/
          if-no-files-found: warn
