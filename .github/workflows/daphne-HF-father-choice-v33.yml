name: "Daphne HF sex-code father-choice bias guard v0.33"
on:
  workflow_dispatch:
  push:
    branches:
      - research/angiosperm-reproductive-decoupling-20261115
    paths:
      - scripts/daphne_jezoensis_2018_2020_HF_model_coding_v33.py
      - scripts/daphne_jezoensis_2018_2020_flower_to_paternity_choice_v30.py
      - .github/workflows/daphne-HF-father-choice-v33.yml
permissions:
  contents: read
jobs:
  sex-code-conditioned-father-choices:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Original source dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas scipy
      - name: Refitting H-plus-HF parentage and maternal fruit source tables
        run: .venv/bin/python scripts/daphne_jezoensis_2018_2020_HF_model_coding_v33.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-HF-morph-fruiting-and-father-choice-v33
          path: analysis_results_daphne_HF_coding_father_model_v33/
          retention-days: 30
          if-no-files-found: warn
