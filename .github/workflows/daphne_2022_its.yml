name: Published Daphne nrITS 2022 accession audit
on:
  push:
    branches: [research/onishibari-sex-system-20261114]
    paths: ['analysis/acquire_daphne_2022_ITS.py', 'analysis/check_kiusiana_its_resolution.py', '.github/workflows/daphne_2022_its.yml']
  pull_request:
    paths: ['analysis/acquire_daphne_2022_ITS.py', 'analysis/check_kiusiana_its_resolution.py', '.github/workflows/daphne_2022_its.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-and-acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install accession parser
        run: python3 -m pip install --quiet biopython==1.86
      - name: Verify 19 published accession mappings without querying NCBI
        run: python3 analysis/acquire_daphne_2022_ITS.py --self-test
      - name: Retrieve published ITS sequences with taxon and accession guards
        run: python3 -u analysis/acquire_daphne_2022_ITS.py --out data/derived/lee2022_ITS_evidence
      - name: Test geographic ITS variation and zero-fixed-SNP diagnostics
        run: python3 analysis/check_kiusiana_its_resolution.py --self-test
      - name: Audit Kumamoto and Jeju variation in original 780bp sequences
        run: |
          python3 analysis/check_kiusiana_its_resolution.py \
            --raw data/derived/lee2022_ITS_evidence/published_2022_ITS.fasta \
            --output data/derived/lee2022_ITS_evidence/kiusiana_original_marker_variation.json
      - name: Save original sequence metadata and explicit failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daphne-2022-population-ITS-verified
          path: data/derived/lee2022_ITS_evidence/
          retention-days: 90
