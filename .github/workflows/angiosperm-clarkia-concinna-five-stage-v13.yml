name: "Clarkia concinna original 5 experiments: signal, geitonogamy, seed and pollen supply"

on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/clarkia_concinna_five_stage_refit_v13.py
      - .github/workflows/angiosperm-clarkia-concinna-five-stage-v13.yml

permissions:
  contents: read

jobs:
  experimental-stage-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install source original statistical tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas scipy statsmodels
      - name: Refit the five separate Clarkia source experimental stages with true denominators
        run: .venv/bin/python scripts/clarkia_concinna_five_stage_refit_v13.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clarkia-concinna-five-stage-original-reanalysis-v13
          path: analysis_results_clarkia_concinna_stages_v13/
          retention-days: 30
          if-no-files-found: warn
