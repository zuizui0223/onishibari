name: "Daphne 2015 female-vs-hermaphrodite natural flowering census audit v0.22"
on:
  workflow_dispatch:
  push:
    branches:
      - research/angiosperm-reproductive-decoupling-20261115
    paths:
      - scripts/daphne_jezoensis_2015_phenology_source_v22.py
      - .github/workflows/daphne-2015-source-v22.yml
permissions:
  contents: read
jobs:
  author-original-2015-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install source analysis
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q pandas numpy
      - name: Verify original source and 2015 sex survey denominators
        run: .venv/bin/python scripts/daphne_jezoensis_2015_phenology_source_v22.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-2015-natural-flowering-sex-source-audit-v22
          path: analysis_results_daphne_2015_phenology_v22/
          retention-days: 30
          if-no-files-found: warn
