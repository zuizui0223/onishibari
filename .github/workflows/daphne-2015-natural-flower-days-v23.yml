name: "Daphne 2015 normalized versus absolute natural flower-days 166 plants (v0.23)"
on:
  workflow_dispatch:
  push:
    branches:
      - research/angiosperm-reproductive-decoupling-20261115
    paths:
      - scripts/daphne_jezoensis_2015_natural_flower_days_v23.py
      - .github/workflows/daphne-2015-natural-flower-days-v23.yml
permissions:
  contents: read
jobs:
  original-sex-window-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source analysis environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas scipy
      - name: Refit normalized and absolute flower-day distributions from source
        run: .venv/bin/python scripts/daphne_jezoensis_2015_natural_flower_days_v23.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-2015-Daphne-166-FH-plant-flower-days-v23
          path: analysis_results_daphne_2015_flower_days_v23/
          retention-days: 30
          if-no-files-found: warn
