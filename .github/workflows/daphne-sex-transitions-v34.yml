name: "Daphne genotype-matched 2018-to-2020 sex-code and fruit/paternity transitions v0.34"
on:
  workflow_dispatch:
  push:
    branches:
      - research/angiosperm-reproductive-decoupling-20261115
    paths:
      - scripts/daphne_jezoensis_2018_2020_sex_code_transitions_v34.py
      - .github/workflows/daphne-sex-transitions-v34.yml
permissions:
  contents: read
jobs:
  source-matched-2018-2020-sex-phenology:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install source analysis libraries
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas scipy
      - name: Verify published SSR and repeated-genet sex/fruit transitions
        run: .venv/bin/python scripts/daphne_jezoensis_2018_2020_sex_code_transitions_v34.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-sex-coding-2018-2020-genet-transitions-v34
          path: analysis_results_daphne_2018_2020_sex_states_v34/
          retention-days: 30
          if-no-files-found: warn
