name: "Daphne source floral longevity and sex-treatment pairing v0.20"
on:
  workflow_dispatch:
  push:
    branches:
      - research/angiosperm-reproductive-decoupling-20261115
    paths:
      - scripts/daphne_jezoensis_2023_longevity_source_v20.py
      - .github/workflows/daphne-longevity-source-v20.yml
permissions:
  contents: read
jobs:
  author-source-longevity-design:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source read environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q numpy pandas
      - name: Verify hash-pinned original floral census and group pairing
        run: .venv/bin/python scripts/daphne_jezoensis_2023_longevity_source_v20.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daphne-floral-longevity-original-source-design-v20
          path: analysis_results_daphne_longevity_v20/
          retention-days: 30
          if-no-files-found: warn
