name: Pulsatilla original cohort sharp missing-outcome identification v62
on:
  workflow_dispatch:
  push:
    branches: [research/angiosperm-reproductive-decoupling-20261115]
    paths:
      - scripts/pulsatilla_v62_partial_identification.py
      - scripts/verify_pulsatilla_partial_id_v62.py
      - data/2026-11-24_pulsatilla_partial_identification_v62.json
      - results/2026-11-24_pulsatilla_partial_id_v62.md
      - .github/workflows/pulsatilla-v62-partial-identification.yml
permissions: {contents: read}
jobs:
  known-outcome-and-untracked-cap-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Recompute partial-identification regions on source-verified v61 enrollment data
        run: python3 scripts/pulsatilla_v62_partial_identification.py
      - name: Verify exact original source aggregate and all conditional sharp identification bounds
        run: python3 scripts/verify_pulsatilla_partial_id_v62.py --actual analysis_results_pulsatilla_identification_v62/pulsatilla_original_cohort_partial_identification_v62.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulsatilla-v62-conditional-bounds
          path: analysis_results_pulsatilla_identification_v62/
          retention-days: 30
